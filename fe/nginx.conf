server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ảnh đính kèm tối đa 5 MB (API cho phép request 6 MB); nginx mặc định chỉ 1 MB nên phải nới.
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Phân giải tên "api" khi có request (DNS nội bộ của Docker) để nginx vẫn khởi động
    # được dù container api chưa chạy / đang khởi động lại.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Mọi API đều nằm dưới /api/ (api/v1/...)
    location /api/ {
        set $backend http://api:8080;
        proxy_pass $backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Gợi ý bậc thợ bằng AI (Gemini) có thể chạy tới ~90 giây
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # File build có hash trong tên -> cache dài hạn
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html không cache để lần deploy mới có hiệu lực ngay
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: đường dẫn không phải file thì trả về index.html (react-router xử lý)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

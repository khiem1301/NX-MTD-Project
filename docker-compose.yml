# NX-MTD: SQL Server + Backend (.NET 9) + Frontend (nginx)
# Dùng:  cp .env.example .env  (điền giá trị)  ->  docker compose up -d --build
# Hướng dẫn đầy đủ: xem phần trả lời / tài liệu triển khai.

name: nxmtd

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD:?Thiếu DB_SA_PASSWORD trong file .env}
      # Express: miễn phí dùng cho production (giới hạn 10 GB/DB, 1 GB RAM cho buffer).
      # Developer (mặc định của image) CHỈ được dùng cho dev/test, không dùng production.
      MSSQL_PID: ${MSSQL_PID:-Express}
    volumes:
      - sqldata:/var/opt/mssql
      - ./SQL:/work/SQL:ro          # để chạy script tạo DB bằng sqlcmd trong container
    ports:
      - "127.0.0.1:${DB_PORT:-1433}:1433"   # chỉ mở trên chính máy này (server: dùng SSH tunnel nếu cần SSMS)
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build: ./be
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Production: tắt Swagger và KHÔNG tự đặt mật khẩu cho tài khoản seed (xem hướng dẫn bước 6)
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: "Server=db,1433;Database=NXMTD;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Jwt__Key: ${JWT_KEY:?Thiếu JWT_KEY trong file .env (>= 32 ký tự)}
      Cors__Origins__0: ${PUBLIC_URL:-http://localhost}
      Seed__DefaultPassword: ${SEED_DEFAULT_PASSWORD:-123456}
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
    volumes:
      - appdata:/app/App_Data       # ảnh đính kèm, bảng lương, nháp AI
    # Không publish cổng: chỉ container web (nginx) gọi vào được

  web:
    build:
      context: ./fe
      args:
        VITE_API_BASE_URL: ""       # rỗng = cùng domain, đi qua nginx /api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  sqldata:
  appdata:
